name: Release gates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  published-gates:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout default branch ref (published gate requires a named branch)
        run: git checkout -B main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml ruff mypy

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Lint and type check
        run: |
          ruff check scripts tests
          mypy scripts

      - name: Package validation
        run: python scripts/validate_skill.py .

      - name: Trigger eval
        run: python scripts/trigger_eval.py . --cases evals/trigger_cases.json

      - name: Output eval (recorded fixtures)
        run: python scripts/output_eval.py . --cases evals/output_cases.json

      - name: Published release gates (remote version, release, clean install)
        run: python scripts/release_check.py . --phase published --run-tests --install-check
