name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: with-pyyaml
            install_pyyaml: true
          - name: without-pyyaml
            install_pyyaml: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        if: matrix.install_pyyaml
        run: python -m pip install --quiet pyyaml

      - name: Syntax check
        run: python -m compileall -q scripts tests

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Install linters
        run: python -m pip install --quiet ruff mypy

      - name: Lint
        run: ruff check scripts tests

      - name: Type check
        run: mypy scripts

      - name: Package validation
        run: python scripts/validate_skill.py .

      - name: Trigger eval
        run: python scripts/trigger_eval.py . --cases evals/trigger_cases.json

      - name: Output eval (recorded fixtures)
        run: python scripts/output_eval.py . --cases evals/output_cases.json

      - name: Skill IR export
        run: python scripts/export_skill_ir.py . --output /tmp/skill-ir.json
